<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alvi Web — Beta</title>
<style>
:root{color-scheme:dark;--bg:#10131b;--panel:#1a2030;--accent:#8b7cff;--text:#f4f5fb;--muted:#aab1c5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:16px}.app{width:min(100%,760px);height:min(90dvh,800px);min-height:520px;background:var(--panel);border:1px solid #30384c;border-radius:20px;display:flex;flex-direction:column;overflow:hidden}.head{padding:16px 20px;border-bottom:1px solid #30384c;display:flex;justify-content:space-between;align-items:center}.head h1{font-size:20px;margin:0}.status{font-size:12px;color:var(--muted)}.login{margin:auto;width:min(90%,360px);display:grid;gap:12px}.login h2{margin:0}.hint{color:var(--muted);font-size:13px;line-height:1.4}input,button{font:inherit;border-radius:12px;padding:12px;border:1px solid #3a4560;background:#111725;color:var(--text)}button{background:var(--accent);border:0;color:white;font-weight:650;cursor:pointer}button:disabled{opacity:.5}.chat{display:none;flex:1;min-height:0;flex-direction:column}.messages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px}.msg{max-width:85%;padding:10px 13px;border-radius:15px;background:#293247;overflow-wrap:anywhere}.msg.mine{align-self:flex-end;background:#5146a8}.sender{font-size:12px;font-weight:700;opacity:.8;margin-bottom:4px}.time{font-size:10px;opacity:.6;margin-top:5px}.compose{display:flex;gap:8px;padding:12px;border-top:1px solid #30384c}.compose input{flex:1;min-width:0}.error{color:#ff9f9f;font-size:13px;min-height:18px}.foot{padding:8px 14px;color:var(--muted);font-size:11px;text-align:center}
</style></head><body><main class="app"><header class="head"><h1>Alvi Web <span style="font-size:11px;color:#b7afff">BETA</span></h1><span id="status" class="status">Desconectado</span></header>
<section id="login" class="login"><h2>Entrar na sala</h2><p class="hint">Use seu nome e o código compartilhado da sala. Esta versão de teste permite mensagens de texto.</p><input id="name" maxlength="40" placeholder="Seu nome (Allanzito ou Davi)" autocomplete="nickname"><input id="code" inputmode="numeric" maxlength="6" placeholder="Código de 6 dígitos" autocomplete="one-time-code"><button id="enter">Entrar</button><div id="loginError" class="error"></div></section>
<section id="chat" class="chat"><div id="messages" class="messages" aria-live="polite"></div><form id="compose" class="compose"><input id="message" maxlength="5000" placeholder="Escreva uma mensagem…" autocomplete="off"><button id="send">Enviar</button></form><div class="foot"><button id="logout" style="padding:6px 10px;font-size:12px">Sair desta sessão</button> · mensagens atualizadas automaticamente</div></section></main>
<script>
const SUPABASE_URL='https://jqjqohhnknugqvmxdztt.supabase.co';
const SUPABASE_KEY='sb_publishable_S4BCdMkIcLTk-LXNoHykhw_MZPhJKQs';
const ROOM_ID='ea091f43-9505-47f8-9746-9929f14a54eb';
const ENTER_URL=SUPABASE_URL+'/functions/v1/alvi-enter-room';
let sessionToken='',displayName='',timer=null,lastIds=new Set();
const $=id=>document.getElementById(id); const status=t=>$('status').textContent=t;
async function rpc(name,args){const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});let data;try{data=await r.json()}catch{data=null}if(!r.ok)throw new Error(data?.message||'Falha na comunicação ('+r.status+')');return data}
$('enter').onclick=async()=>{const name=$('name').value.trim(),code=$('code').value.trim();$('loginError').textContent='';if(!name||!/^[0-9]{6}$/.test(code)){$('loginError').textContent='Informe seu nome e o código de 6 dígitos.';return}$('enter').disabled=true;status('Validando…');try{const r=await fetch(ENTER_URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},body:JSON.stringify({code,display_name:name})});const d=await r.json();if(!r.ok||!d.session_token)throw new Error(d.error||'Não foi possível entrar.');sessionToken=d.session_token;displayName=name;$('login').style.display='none';$('chat').style.display='flex';status('Conectado');await loadMessages();timer=setInterval(loadMessages,2500);$('message').focus()}catch(e){status('Desconectado');$('loginError').textContent=e.message}finally{$('enter').disabled=false}};
async function loadMessages(){if(!sessionToken)return;try{const rows=await rpc('alvi_list_messages',{p_room_id:ROOM_ID,p_session_token:sessionToken,p_limit:100});if(!Array.isArray(rows))return;rows.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));for(const m of rows){if(lastIds.has(m.id))continue;lastIds.add(m.id);const el=document.createElement('article');el.className='msg'+(m.sender_name===displayName?' mine':'');const who=document.createElement('div');who.className='sender';who.textContent=m.sender_name||'Participante';const body=document.createElement('div');body.textContent=m.body||'(mensagem sem texto)';const time=document.createElement('div');time.className='time';time.textContent=m.created_at?new Date(m.created_at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'';el.append(who,body,time);$('messages').append(el)}$('messages').scrollTop=$('messages').scrollHeight;status('Conectado')}catch(e){status('Reconectando…')}}
$('compose').onsubmit=async e=>{e.preventDefault();const text=$('message').value.trim();if(!text||!sessionToken)return;$('send').disabled=true;try{await rpc('alvi_send_message',{p_room_id:ROOM_ID,p_session_token:sessionToken,p_sender_name:displayName,p_kind:'text',p_body:text,p_media_path:null});$('message').value='';await loadMessages()}catch(e){alert('Não foi possível enviar: '+e.message)}finally{$('send').disabled=false;$('message').focus()}};
$('logout').onclick=()=>{sessionToken='';if(timer)clearInterval(timer);timer=null;lastIds.clear();$('messages').replaceChildren();$('chat').style.display='none';$('login').style.display='grid';status('Desconectado')};
</script></body></html>
